<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Free Fire Proxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: #f5f5f5;
            color: #333;
        }
        
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-title {
            font-size: 32px;
            color: #4CAF50;
            font-weight: 700;
        }
        
        .logout-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #ff4757;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }
        
        .admin-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .card-title {
            font-size: 24px;
            color: #222;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #4CAF50;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s ease;
        }
        
        .form-input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        
        .save-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .save-btn:hover {
            background: #2E7D32;
        }
        
        .video-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .video-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .video-title {
            font-weight: 500;
            color: #333;
        }
        
        .video-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .edit-btn {
            background: #2196F3;
            color: white;
        }
        
        .delete-btn {
            background: #ff6b6b;
            color: white;
        }
        
        .add-video-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        .add-video-btn:hover {
            background: #2E7D32;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }
        
        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
        
        <div class="admin-grid">
            <!-- Configuration Card -->
            <div class="admin-card">
                <h2 class="card-title">Configuration Settings</h2>
                
                <div class="form-group">
                    <label class="form-label">Download APK Link</label>
                    <input type="url" class="form-input" id="downloadLink" 
                           placeholder="https://example.com/download.apk">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Proxy Server IP</label>
                    <input type="text" class="form-input" id="proxyIp" 
                           placeholder="192.168.1.1">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Proxy Server Port</label>
                    <input type="text" class="form-input" id="proxyPort" 
                           placeholder="8080">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Server Status</label>
                    <div style="display: flex; gap: 15px;">
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="radio" name="status" value="online" checked>
                            <span class="status-indicator status-online">
                                <i class="fas fa-circle"></i> Online
                            </span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="radio" name="status" value="offline">
                            <span class="status-indicator status-offline">
                                <i class="fas fa-circle"></i> Offline
                            </span>
                        </label>
                    </div>
                </div>
                
                <button class="save-btn" onclick="saveConfig()">
                    <i class="fas fa-save"></i> Save Configuration
                </button>
            </div>
            
            <!-- Videos Management Card -->
            <div class="admin-card">
                <h2 class="card-title">YouTube Videos Management</h2>
                
                <div class="video-list" id="videoList">
                    <!-- Videos will be loaded here -->
                </div>
                
                <button class="add-video-btn" onclick="showAddVideoModal()">
                    <i class="fas fa-plus"></i> Add New Video
                </button>
            </div>
        </div>
    </div>
    
    <!-- Add Video Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 20px;">Add/Edit Video</h2>
            
            <div class="form-group">
                <label class="form-label">Video Title</label>
                <input type="text" class="form-input" id="videoTitle" placeholder="Enter video title">
            </div>
            
            <div class="form-group">
                <label class="form-label">YouTube Embed URL</label>
                <input type="url" class="form-input" id="videoUrl" 
                       placeholder="https://www.youtube.com/embed/VIDEO_ID">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Use embed URL (not regular watch URL)
                </small>
            </div>
            
            <div class="form-group">
                <label class="form-label">Thumbnail URL (Optional)</label>
                <input type="url" class="form-input" id="videoThumbnail" 
                       placeholder="https://img.youtube.com/vi/VIDEO_ID/0.jpg">
            </div>
            
            <div class="form-group">
                <label class="form-label">Display Order</label>
                <input type="number" class="form-input" id="videoOrder" value="1" min="1">
            </div>
            
            <button class="save-btn" onclick="saveVideo()">
                <i class="fas fa-save"></i> Save Video
            </button>
        </div>
    </div>
    
    <script>
        let currentVideoId = null;
        
        // Load configuration
        async function loadConfig() {
            try {
                const response = await fetch('/admin/config');
                const config = await response.json();
                
                if (response.ok) {
                    // Load existing config if available
                    // You would implement this based on your Firebase structure
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }
        
        // Load videos
        async function loadVideos() {
            try {
                const response = await fetch('/admin/videos');
                const videos = await response.json();
                
                const videoList = document.getElementById('videoList');
                videoList.innerHTML = '';
                
                if (response.ok && Array.isArray(videos)) {
                    videos.forEach(video => {
                        const videoItem = document.createElement('div');
                        videoItem.className = 'video-item';
                        videoItem.innerHTML = `
                            <div>
                                <div class="video-title">${video.title}</div>
                                <small style="color: #666;">Order: ${video.order || 1}</small>
                            </div>
                            <div class="video-actions">
                                <button class="action-btn edit-btn" onclick="editVideo('${video.id}')">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="action-btn delete-btn" onclick="deleteVideo('${video.id}')">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        `;
                        videoList.appendChild(videoItem);
                    });
                }
            } catch (error) {
                console.error('Error loading videos:', error);
            }
        }
        
        // Save configuration
        async function saveConfig() {
            const config = {
                download_link: document.getElementById('downloadLink').value,
                proxy_ip: document.getElementById('proxyIp').value,
                proxy_port: document.getElementById('proxyPort').value,
                status: document.querySelector('input[name="status"]:checked').value
            };
            
            try {
                const response = await fetch('/admin/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });
                
                if (response.ok) {
                    alert('Configuration saved successfully!');
                } else {
                    alert('Error saving configuration');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving configuration');
            }
        }
        
        // Show add video modal
        function showAddVideoModal() {
            currentVideoId = null;
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoUrl').value = '';
            document.getElementById('videoThumbnail').value = '';
            document.getElementById('videoOrder').value = 1;
            document.getElementById('videoModal').style.display = 'flex';
        }
        
        // Edit video
        function editVideo(videoId) {
            // In production, load video data from Firebase
            currentVideoId = videoId;
            document.getElementById('videoModal').style.display = 'flex';
        }
        
        // Save video
        async function saveVideo() {
            const videoData = {
                title: document.getElementById('videoTitle').value,
                url: document.getElementById('videoUrl').value,
                thumbnail: document.getElementById('videoThumbnail').value || 
                          document.getElementById('videoUrl').value.replace('embed/', 'vi/') + '/0.jpg',
                order: parseInt(document.getElementById('videoOrder').value)
            };
            
            try {
                const url = currentVideoId ? 
                    `/admin/videos?id=${currentVideoId}` : '/admin/videos';
                
                const response = await fetch(url, {
                    method: currentVideoId ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(videoData)
                });
                
                if (response.ok) {
                    alert('Video saved successfully!');
                    closeModal();
                    loadVideos();
                } else {
                    alert('Error saving video');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving video');
            }
        }
        
        // Delete video
        async function deleteVideo(videoId) {
            if (confirm('Are you sure you want to delete this video?')) {
                try {
                    const response = await fetch(`/admin/videos?id=${videoId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        alert('Video deleted successfully!');
                        loadVideos();
                    } else {
                        alert('Error deleting video');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error deleting video');
                }
            }
        }
        
        // Close modal
        function closeModal() {
            document.getElementById('videoModal').style.display = 'none';
        }
        
        // Logout
        function logout() {
            window.location.href = '/admin/login';
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            loadVideos();
        });
    </script>
</body>
</html>
